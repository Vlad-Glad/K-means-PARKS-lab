# Docker Compose for the Control Plane VM (Master VM #0: 10.0.1.10)
# Runs Parcs.Host, Parcs.Portal, and PostgreSQL without Kubernetes, KEDA, SQS, or Elasticsearch.
# Uses Hosting__Environment=Any and Scaling__Mode=Static so Parcs.Host connects directly over TCP
# to the 8 Worker VMs (10.0.1.11 .. 10.0.1.18) with strictly 1 PARCS Point per Worker VM.

services:
  parcs.database:
    image: postgres:17-alpine
    container_name: parcs-database
    restart: unless-stopped
    environment:
      - POSTGRES_USER=parcs_admin
      - POSTGRES_PASSWORD=${DB_PASSWORD:-ParcsStaticLab2026!}
      - POSTGRES_DB=parcs
    ports:
      - "5432:5432"
    volumes:
      - parcs_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcs_admin -d parcs"]
      interval: 5s
      timeout: 5s
      retries: 10

  parcs.hostapi:
    image: parcs/parcshost:latest
    build:
      context: ../..
      dockerfile: src/Parcs.Host/Dockerfile
    container_name: parcs-hostapi
    restart: unless-stopped
    depends_on:
      parcs.database:
        condition: service_healthy
    ports:
      - "5000:80"
      - "2222:2222"
    volumes:
      - /var/lib/storage:/var/lib/storage
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - Hosting__Environment=Any
      - Scaling__Mode=Static
      - PointQueue__Provider=None
      - FileSystem__BasePath=/var/lib/storage
      - Database__HostName=parcs.database
      - Database__Port=5432
      - Database__DatabaseName=parcs
      - Database__Username=parcs_admin
      - Database__Password=${DB_PASSWORD:-ParcsStaticLab2026!}
      - Elasticsearch__BaseUrl=
      - HostTcp__Port=2222
      - HostTcp__AdvertisedAddress=${MASTER_IP:-10.0.1.10}
      # Static list of 8 Worker VMs (1 PARCS Point per Worker VM, allocated in order by DaemonAllocator)
      - Daemons__PreconfiguredInstances__0__HostUrl=${WORKER_1_IP:-10.0.1.11}
      - Daemons__PreconfiguredInstances__0__Port=1111
      - Daemons__PreconfiguredInstances__1__HostUrl=${WORKER_2_IP:-10.0.1.12}
      - Daemons__PreconfiguredInstances__1__Port=1111
      - Daemons__PreconfiguredInstances__2__HostUrl=${WORKER_3_IP:-10.0.1.13}
      - Daemons__PreconfiguredInstances__2__Port=1111
      - Daemons__PreconfiguredInstances__3__HostUrl=${WORKER_4_IP:-10.0.1.14}
      - Daemons__PreconfiguredInstances__3__Port=1111
      - Daemons__PreconfiguredInstances__4__HostUrl=${WORKER_5_IP:-10.0.1.15}
      - Daemons__PreconfiguredInstances__4__Port=1111
      - Daemons__PreconfiguredInstances__5__HostUrl=${WORKER_6_IP:-10.0.1.16}
      - Daemons__PreconfiguredInstances__5__Port=1111
      - Daemons__PreconfiguredInstances__6__HostUrl=${WORKER_7_IP:-10.0.1.17}
      - Daemons__PreconfiguredInstances__6__Port=1111
      - Daemons__PreconfiguredInstances__7__HostUrl=${WORKER_8_IP:-10.0.1.18}
      - Daemons__PreconfiguredInstances__7__Port=1111

  parcs.portal:
    image: parcs/parcsportal:latest
    build:
      context: ../..
      dockerfile: src/Parcs.Portal/Dockerfile
    container_name: parcs-portal
    restart: unless-stopped
    depends_on:
      - parcs.hostapi
    ports:
      - "80:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - Host__Uri=parcs.hostapi
      - Portal__Uri=parcs.portal
      - Portal__SignalrUri=parcs.portal
      - Elasticsearch__BaseUrl=

volumes:
  parcs_db_data:
